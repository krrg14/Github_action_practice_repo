name: pushing to docker hub 
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Enter the docker tag version"
        required: true
        default: "v1"
      
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: checkouts to source code
        uses: actions/checkout@v4

      - name: login to docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: build docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/web-python-app:${{ github.event.inputs.image_tag }} .

      - name: push to docker hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/web-python-app:${{ github.event.inputs.image_tag }}

      - name: verify images
        run: docker images